<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ร้านหนังสือออนไลน์</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
    <h1 class="text-center">ระบบสมาชิก</h1>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container text-white">
            <a class="navbar-link text-white" href="{{ url_for('index')}}">หน้าแรก</a>
            <a class="navbar-link text-white" href="{{ url_for('members')}}">สมาชิก</a>
            <a class="navbar-link text-white" href="{{ url_for('register')}}">สมัครสมาชิก</a>
            {% if not session.get('member_id')%}
                <a class="navbar-link text-white" href="{{ url_for('login')}}">เข้าสู่ระบบ</a>
            {% else %}
                <a class="navbar-link text-white" href="{{ url_for('logout')}}">ออกจากระบบ</a>
                ผู้ใช้ : {{session.get('member_name')}}
            {% endif %}
        </div>
    </nav>
    <hr>
    <div class="bg-light text-info text-center">
        {% for message in get_flashed_messages() %}
            <h3>
                {{ message }}
            </h3>
        {% endfor %}
    </div>
    
   {% block content %}
   
   {% endblock%}
   <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
